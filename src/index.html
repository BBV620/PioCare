<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PioCare</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Alegerea limbii la prima pornire / Language choice on first start -->
  <div id="lang-pick" class="overlay hidden">
    <div class="dialog">
      <div class="brand dark"><span class="logo">P</span> PioCare</div>
      <h2 id="lang-pick-title">Alege limba · Choose your language</h2>
      <div class="lang-buttons">
        <button data-lang="ro">Română</button>
        <button data-lang="en">English</button>
      </div>
      <p class="sub" id="lang-pick-sub">Poți schimba oricând din meniu. · You can change it any time from the menu.</p>
    </div>
  </div>

  <!-- „Ce este?” / “What is this?” -->
  <div id="explain" class="overlay hidden">
    <div class="dialog left">
      <div class="op-head"><h2 id="ex-name"></h2><span id="ex-verdict" class="badge"></span></div>
      <div id="ex-body"></div>
      <div class="op-actions"><button id="ex-close" data-i18n="ex.close"></button></div>
    </div>
  </div>

  <aside class="side">
    <div class="brand"><span class="logo">P</span> PioCare</div>
    <nav>
      <a class="active" href="#panou" data-page="panou" data-i18n="nav.panou"></a>
      <a href="#monitor" data-page="monitor" data-i18n="nav.monitor"></a>
      <a href="#intretinere" data-page="intretinere" data-i18n="nav.intretinere"></a>
      <a href="#pornire" data-page="pornire" data-i18n="nav.pornire"></a>
      <a href="#sarcini" data-page="sarcini" data-i18n="nav.sarcini"></a>
      <a href="#programe" data-page="programe" data-i18n="nav.programe"></a>
      <a href="#registru" data-page="registru" data-i18n="nav.registru"></a>
      <a href="#servicii" data-page="servicii" data-i18n="nav.servicii"></a>
      <a href="#firewall" data-page="firewall" data-i18n="nav.firewall"></a>
      <a href="#jurnal" data-page="jurnal" data-i18n="nav.jurnal"></a>
      <a href="#ajutor" data-page="ajutor" data-i18n="nav.ajutor"></a>
    </nav>
    <div class="side-bottom">
      <select id="lang-select" aria-label="Language"></select>
      <div class="mode" id="mode"></div>
    </div>
  </aside>

  <main>
    <div class="page" id="page-panou">
      <header>
        <h1 data-i18n="panou.title"></h1>
        <button id="refresh" data-i18n="common.refresh"></button>
      </header>

      <section class="cards">
        <div class="card"><h3>Windows</h3><p class="big" id="win">…</p><p class="sub" id="winver"></p></div>
        <div class="card"><h3 data-i18n="panou.disk"></h3><p class="big" id="disk">…</p><div class="bar"><div id="diskbar"></div></div><p class="sub" id="disksub"></p></div>
        <div class="card"><h3 data-i18n="panou.apps"></h3><p class="big" id="apps">…</p><p class="sub" data-i18n="panou.appsSub"></p></div>
        <div class="card"><h3 data-i18n="panou.uptime"></h3><p class="big" id="uptime">…</p><p class="sub" id="pc"></p></div>
        <div class="card"><h3 data-i18n="panou.rules"></h3><p class="big" id="rules">…</p><p class="sub" id="rulessub"></p></div>
        <div class="card"><h3 data-i18n="panou.lastBackup"></h3><p class="big" id="lastbackup">…</p><p class="sub" id="lastbackupsub"></p></div>
      </section>

      <section class="modules">
        <h2 data-i18n="panou.modules"></h2>
        <div class="grid">
          <div class="mod"><b data-i18n="panou.mod.mt"></b><span data-i18n="panou.mod.mt.sub"></span></div>
          <div class="mod"><b data-i18n="panou.mod.reg"></b><span data-i18n="panou.mod.reg.sub"></span></div>
          <div class="mod"><b data-i18n="panou.mod.svc"></b><span data-i18n="panou.mod.svc.sub"></span></div>
          <div class="mod"><b data-i18n="panou.mod.fw"></b><span data-i18n="panou.mod.fw.sub"></span></div>
        </div>
        <p class="note" data-i18n="panou.note"></p>
      </section>

      <section>
        <h2 data-i18n="rp.title"></h2>
        <p class="lead" data-i18n="rp.lead"></p>
        <div id="packs"></div>
        <div class="op-actions"><button class="ghost" id="btn-rules-folder" data-i18n="rp.folder"></button></div>
      </section>
    </div>

    <div class="page hidden" id="page-monitor">
      <header>
        <h1 data-i18n="mon.title"></h1>
        <span class="sub" id="mon-cpuname"></span>
      </header>
      <section class="gauges">
        <div class="card gauge"><h3 data-i18n="mon.cpu"></h3><svg viewBox="0 0 120 120" class="ring"><circle cx="60" cy="60" r="50" class="ring-bg"/><circle cx="60" cy="60" r="50" class="ring-fg" id="ring-cpu"/><text x="60" y="58" class="ring-val" id="val-cpu">–</text><text x="60" y="78" class="ring-sub" id="sub-cpu"></text></svg></div>
        <div class="card gauge"><h3 data-i18n="mon.ram"></h3><svg viewBox="0 0 120 120" class="ring"><circle cx="60" cy="60" r="50" class="ring-bg"/><circle cx="60" cy="60" r="50" class="ring-fg" id="ring-ram"/><text x="60" y="58" class="ring-val" id="val-ram">–</text><text x="60" y="78" class="ring-sub" id="sub-ram"></text></svg></div>
        <div class="card gauge"><h3 data-i18n="mon.gpu"></h3><svg viewBox="0 0 120 120" class="ring"><circle cx="60" cy="60" r="50" class="ring-bg"/><circle cx="60" cy="60" r="50" class="ring-fg" id="ring-gpu"/><text x="60" y="58" class="ring-val" id="val-gpu">–</text><text x="60" y="78" class="ring-sub" id="sub-gpu"></text></svg><p class="sub" id="gpu-note"></p></div>
        <div class="card gauge"><h3 data-i18n="mon.procs"></h3><p class="big" id="val-procs">–</p><p class="sub" id="sub-swap"></p><p class="sub" data-i18n="mon.tempNote"></p></div>
      </section>
      <div class="card chart"><div class="legend-row"><span class="dot cpu"></span><span data-i18n="mon.cpu"></span><span class="dot ram"></span><span data-i18n="mon.ram"></span><span class="sub" data-i18n="mon.lastMin"></span></div>
        <svg viewBox="0 0 600 140" preserveAspectRatio="none" id="mon-chart"><polyline id="line-cpu" class="line cpu"/><polyline id="line-ram" class="line ram"/></svg></div>
      <h2 data-i18n="mon.procTitle"></h2>
      <div class="seg" id="mon-sort">
        <label><input type="radio" name="monsort" value="ram" checked> <span data-i18n="mon.byRam"></span></label>
        <label><input type="radio" name="monsort" value="cpu"> <span data-i18n="mon.byCpu"></span></label>
      </div>
      <div id="mon-status" class="status hidden"></div>
      <table class="ptable"><thead><tr><th data-i18n="mon.colName"></th><th data-i18n="mon.colRam"></th><th data-i18n="mon.colCpu"></th><th></th></tr></thead><tbody id="mon-procs"></tbody></table>
    </div>

    <div class="page hidden" id="page-intretinere">
      <header>
        <h1 data-i18n="mt.title"></h1>
        <div class="actions">
          <button class="ghost" id="btn-mt-scan" data-i18n="common.scan"></button>
          <button id="btn-mt-clean" disabled data-i18n="common.clean"></button>
        </div>
      </header>
      <p class="lead" data-i18n="mt.lead"></p>
      <div id="mt-status" class="status hidden"></div>
      <div id="mt-results"><p class="empty" data-i18n="mt.empty"></p></div>
    </div>

    <div class="page hidden" id="page-pornire">
      <header>
        <h1 data-i18n="st.title"></h1>
        <div class="actions"><button class="ghost" id="btn-st-refresh" data-i18n="common.refresh"></button></div>
      </header>
      <p class="lead" data-i18n="st.lead"></p>
      <div id="st-status" class="status hidden"></div>
      <div id="st-list"></div>
    </div>

    <div class="page hidden" id="page-sarcini">
      <header>
        <h1 data-i18n="tk.title"></h1>
        <div class="actions"><button class="ghost" id="btn-tk-refresh" data-i18n="common.refresh"></button></div>
      </header>
      <p class="lead" data-i18n="tk.lead"></p>
      <div id="tk-status" class="status hidden"></div>
      <div id="tk-list"></div>
    </div>

    <div class="page hidden" id="page-programe">
      <header>
        <h1 data-i18n="un.title"></h1>
        <div class="actions"><button class="ghost" id="btn-un-refresh" data-i18n="common.refresh"></button></div>
      </header>
      <p class="lead" data-i18n="un.lead"></p>
      <div class="op">
        <div class="op-head"><div><b data-i18n="or.title"></b><div class="sub" data-i18n="or.lead"></div></div>
          <div class="actions"><button class="ghost" id="btn-or-scan" data-i18n="common.scan"></button><button id="btn-or-clean" class="hidden" data-i18n="or.clean"></button></div></div>
        <div id="or-status" class="status hidden" style="margin-top:10px"></div>
        <div id="or-list"></div>
      </div>
      <div id="un-flow" class="hidden">
        <div class="op">
          <div class="op-head"><div><b id="un-name"></b><div class="sub" id="un-sub"></div></div><span class="badge" id="un-badge"></span></div>
          <div id="un-status" class="status hidden" style="margin-top:10px"></div>
          <div id="un-left"></div>
          <div class="op-actions">
            <button id="btn-un-clean" class="hidden" data-i18n="un.clean"></button>
            <button id="btn-un-close" class="ghost" data-i18n="ex.close"></button>
          </div>
          <div id="un-after"></div>
        </div>
      </div>
      <input id="un-filter" class="search" data-i18n-ph="un.filter">
      <div id="un-list"></div>
    </div>

    <div class="page hidden" id="page-registru">
      <header>
        <h1 data-i18n="reg.title"></h1>
        <div class="actions">
          <button class="ghost" id="btn-scan" data-i18n="common.scan"></button>
          <button id="btn-clean" disabled data-i18n="common.clean"></button>
        </div>
      </header>
      <p class="lead" data-i18n="reg.lead"></p>
      <div id="reg-status" class="status hidden"></div>
      <div id="reg-results"><p class="empty" data-i18n="reg.empty"></p></div>
    </div>

    <div class="page hidden" id="page-servicii">
      <header>
        <h1 data-i18n="svc.title"></h1>
        <div class="actions">
          <button id="btn-svc-apply" disabled data-i18n="common.apply"></button>
        </div>
      </header>
      <p class="lead" data-i18n="svc.lead"></p>

      <div class="op">
        <b data-i18n="svc.profile"></b>
        <div class="seg" id="profiles">
          <label><input type="radio" name="profile" value="acasa" checked> <span data-i18n="svc.p.acasa"></span></label>
          <label><input type="radio" name="profile" value="birou"> <span data-i18n="svc.p.birou"></span></label>
          <label><input type="radio" name="profile" value="gaming"> <span data-i18n="svc.p.gaming"></span></label>
        </div>
        <b data-i18n="svc.uses"></b>
        <div class="feats" id="features"></div>
      </div>

      <div id="svc-status" class="status hidden"></div>
      <div id="svc-proposals"></div>

      <h2 data-i18n="svc.mapTitle"></h2>
      <p class="lead" data-i18n="svc.mapLead"></p>
      <input id="svc-filter" class="search" data-i18n-ph="svc.filter">
      <div id="svc-map" class="map"></div>
    </div>

    <div class="page hidden" id="page-firewall">
      <header>
        <h1 data-i18n="fw.title"></h1>
        <div class="actions">
          <button id="btn-fw-apply" disabled data-i18n="common.apply"></button>
        </div>
      </header>
      <p class="lead" data-i18n="fw.lead"></p>

      <section class="cards" id="fw-profiles"></section>

      <div class="op" style="margin-top:14px">
        <b data-i18n="fw.uses"></b>
        <div class="feats" id="fw-features"></div>
      </div>
      <div id="fw-status" class="status hidden"></div>
      <div id="fw-proposals"></div>

      <h2 data-i18n="fw.liveTitle"></h2>
      <p class="lead" data-i18n="fw.liveLead"></p>
      <div class="actions" style="margin-bottom:10px"><button class="ghost" id="btn-fw-activity" data-i18n="common.refresh"></button></div>
      <div id="fw-activity"></div>
    </div>

    <div class="page hidden" id="page-ajutor">
      <header><h1 data-i18n="help.title"></h1></header>
      <div class="op help" id="help-body"></div>
      <p class="sub" id="about"></p>
    </div>

    <div class="page hidden" id="page-jurnal">
      <header>
        <h1 data-i18n="j.title"></h1>
        <div class="actions">
          <button id="btn-backup" data-i18n="j.backup" data-i18n-title="j.backup.tip"></button>
        </div>
      </header>
      <div id="protect" class="status warn hidden">
        <b data-i18n="j.protect.title"></b>
        <span data-i18n="j.protect.text"></span>
        <div class="op-actions"><button id="btn-protect" data-i18n="j.protect.btn"></button></div>
      </div>
      <div class="op" id="rp-box">
        <div class="op-head"><div><b data-i18n="rpx.title"></b><div class="sub" data-i18n="rpx.lead"></div></div>
          <button class="ghost" id="btn-rp-show" data-i18n="rpx.show"></button></div>
        <div id="rp-info"></div>
      </div>
      <p class="lead" data-i18n="j.lead"></p>
      <div id="status" class="status hidden"></div>
      <div id="ops"></div>
    </div>
  </main>

  <script src="i18n/ro.js"></script>
  <script src="i18n/en.js"></script>
  <script src="i18n/help-ro.js"></script>
  <script src="i18n/help-en.js"></script>
  <script src="app.js"></script>
</body>
</html>
